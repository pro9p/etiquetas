<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas Dimexa</title>
    <script src="mammoth.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @page { size: A4; margin: 0; }
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        
        .panel-control {
            background: white; padding: 20px; margin: 20px auto; max-width: 1100px;
            border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;
        }
        .panel-control h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        
        input[type="file"], input[type="text"], input[type="number"] { 
            margin: 5px 0; padding: 12px; border: 1px solid #ccc; 
            border-radius: 4px; width: 100%; box-sizing: border-box; font-size: 16px;
        }
        
        .editor {
            width: 100%; min-height: 120px; padding: 10px; 
            border: 2px dashed #007bff; border-radius: 4px; 
            font-family: Arial, sans-serif; font-size: 15px; 
            resize: vertical; outline: none; background-color: #f0f8ff;
            white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; tab-size: 4;
        }
        .editor:focus { border-color: #ff9800; background-color: #fff8f0; }

        .btn {
            color: white; border: none; padding: 12px 25px;
            font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%;
        }
        .btn-buscar { background-color: #007bff; }
        .btn-buscar:hover { background-color: #0056b3; }
        
        .fila-cajas {
            display: flex; gap: 10px; align-items: flex-end; margin-top: 15px; display: none;
        }
        .fila-cajas .form-group { flex: 1; margin-bottom: 0; }
        .fila-cajas .form-group:first-child { flex: 0 0 130px; }
        
        .navegador-controles { display: flex; gap: 10px; align-items: center; }
        .navegador-controles input {
            width: 100px; text-align: center; padding: 8px;
            font-size: 16px; border: 1px solid #ccc; border-radius: 4px;
        }
        .btn-ir {
            background-color: #ffc107; color: black; border: none; padding: 8px 20px;
            font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }

        /* ✅ BOTONES DE ACCIÓN */
        .contenedor-botones-accion {
            display: none; justify-content: space-between; gap: 10px; margin-top: 20px;
        }
        .btn-accion {
            flex: 1; padding: 12px; font-size: 15px; font-weight: bold;
            color: white; border: none; border-radius: 5px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s;
        }
        .btn-generar { background-color: #ff9800; }
        .btn-generar:hover { background-color: #e68900; }
        .btn-grs { background-color: #6c757d; }
        .btn-grs:hover { background-color: #5a6268; }
        .btn-imprimir { background-color: #28a745; display: none; }
        .btn-imprimir:hover { background-color: #218838; }

        /* ✅ VENTANA MODAL (FLOTANTE) PARA LAS GRs */
        .modal-fondo {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;
        }
        .modal-caja {
            background: white; width: 90%; max-width: 600px; border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden;
            display: flex; flex-direction: column;
        }
        .modal-header {
            background: #007bff; color: white; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 18px; }
        .btn-cerrar-modal {
            background: none; border: none; color: white; font-size: 24px;
            cursor: pointer; font-weight: bold;
        }
        .modal-body {
            padding: 20px; max-height: 60vh; overflow-y: auto;
        }
        .tabla-grs { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .tabla-grs th, .tabla-grs td { padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; text-align: left; }
        .tabla-grs th { color: #555; }
        .tabla-grs input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-agregar-gr {
            background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; padding: 8px 15px;
            font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 13px;
            margin-bottom: 15px;
        }
        .btn-agregar-gr:hover { background: #bbdefb; }
        .btn-eliminar-gr {
            background: #dc3545; color: white; border: none; padding: 6px 10px;
            border-radius: 3px; cursor: pointer; font-size: 12px;
        }
        .total-etiquetas { font-weight: bold; font-size: 15px; color: #333; text-align: right; margin-top: 10px; }
        
        .modal-footer {
            padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #ddd;
            display: flex; justify-content: flex-end; gap: 10px;
        }
        .btn-modal { padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; font-size: 14px;}
        .btn-cancelar { background: #6c757d; color: white; }
        .btn-aplicar { background: #28a745; color: white; }
        .btn-generar-modal { background: #ff9800; color: white; margin-right: auto; } /* Botón extra a la izquierda */

        /* PANEL DE AJUSTES */
        .panel-ajustes {
            display: none; background-color: #f8f9fa; border: 1px solid #007bff;
            border-radius: 6px; padding: 10px; margin-top: 15px; text-align: left;
        }
        .tabs-ajustes { display: flex; gap: 3px; border-bottom: 2px solid #007bff; margin-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: #e9ecef; border: none; padding: 6px 12px; font-size: 12px; font-weight: bold; color: #555; cursor: pointer; border-radius: 4px 4px 0 0; transition: all 0.2s; }
        .tab-btn.active { background: #007bff; color: white; }
        .tab-content { display: none; padding: 8px 0; }
        .tab-content.active { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 8px 15px; }
        .ajuste-compacto { display: flex; align-items: center; gap: 8px; font-size: 12px; min-width: 0; }
        .ajuste-compacto label { flex: 0 0 110px; font-size: 12px; font-weight: bold; color: #555; text-align: right; white-space: nowrap; }
        .ajuste-compacto input[type="range"] { flex: 1; cursor: pointer; height: 4px; min-width: 0; }
        .ajuste-compacto select, .ajuste-compacto input[type="number"], .ajuste-compacto input[type="text"] { flex: 1; padding: 3px 5px; font-size: 12px; border: 1px solid #ccc; border-radius: 3px; }
        .ajuste-compacto input[type="color"] { flex: 1; height: 24px; padding: 1px; border: 1px solid #ccc; border-radius: 3px; }
        .ajuste-compacto .valor { flex: 0 0 45px; text-align: right; font-size: 11px; font-weight: bold; color: #007bff; }
        .btn-reset-ajustes { background-color: #6c757d; color: white; border: none; padding: 5px 12px; font-size: 11px; border-radius: 3px; cursor: pointer; margin-top: 8px; width: 100%; }

        .indicador-etiqueta {
            position: fixed; bottom: 30px; left: 30px; background-color: #333; color: white;
            padding: 10px 18px; border-radius: 25px; font-size: 14px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: none; z-index: 9999;
        }
        .indicador-etiqueta.visible { display: block; }

        .hoja {
            width: 210mm; height: 297mm; background: white; margin: 5mm auto;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 15mm; padding-bottom: 0; page-break-after: always; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .hoja:last-child { page-break-after: auto; }
        .etiqueta {
            width: 16cm; height: 9.22cm; border: 3px solid black; margin-bottom: 0;
            padding: 0.25cm; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .etiqueta + .etiqueta { margin-top: 15mm; }
        .texto-etiqueta {
            flex: 1; font-size: 18px; font-weight: bold; color: black; font-family: Arial, sans-serif;
            white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
            line-height: 1.4; padding-right: 10px; outline: none; border: 1px dashed #ccc; padding: 5px; min-height: 50px;
        }
        .texto-etiqueta:focus { border-color: #007bff; background-color: #f0f8ff; }
        .texto-etiqueta span { text-decoration: underline; }
        .logo-dimexa { position: absolute; bottom: 0.25cm; right: 0.25cm; width: 5.32cm; height: 2.14cm; object-fit: contain; pointer-events: none; }
        .etiqueta-resaltada { animation: parpadeo 1s ease-in-out 3; box-shadow: 0 0 0 5px #ffc107; }
        @keyframes parpadeo { 0% { box-shadow: 0 0 0 5px #ffc107; } 50% { box-shadow: 0 0 0 5px #ff5722; } 100% { box-shadow: 0 0 0 5px #ffc107; } }

        @media print {
            body { background-color: white; }
            .hoja { margin: 0; padding-top: 15mm; padding-bottom: 0; box-shadow: none; }
            .panel-control { display: none; }
            .indicador-etiqueta { display: none !important; }
            .panel-ajustes { display: none !important; }
            .texto-etiqueta { border: none; }
        }
    </style>
</head>
<body>

    <div class="panel-control no-imprimir">
        <h2>🔍 Buscador de Etiquetas desde Word</h2>
        
        <div class="form-group">
            <label>1. Sube tu archivo Word (.docx):</label>
            <input type="file" id="inputArchivo" accept=".docx">
        </div>

        <div class="form-group">
            <label>2. Busca el cliente:</label>
            <input type="text" id="inputBusqueda" placeholder="Escribe el nombre del cliente...">
        </div>
        
        <button class="btn btn-buscar" onclick="buscarEtiquetas()">🔍 Buscar</button>

        <div class="form-group" id="grupoEditor" style="display: none; margin-top: 20px;">
            <label>3. Edita el texto MAESTRO (se replicará a todas las etiquetas):</label>
            <div id="editorTexto" class="editor" contenteditable="true"></div>
        </div>

        <div class="fila-cajas" id="filaCajas">
            <div class="form-group">
                <label>N° de etiquetas</label>
                <input type="number" id="inputTotalCajas" value="1" min="1">
            </div>
            <div class="form-group">
                <label>🔎 Ir a la etiqueta N°</label>
                <div class="navegador-controles">
                    <input type="number" id="inputIrEtiqueta" placeholder="Ej: 25" min="1">
                    <button class="btn-ir" onclick="irAEtiqueta()">Ir</button>
                </div>
            </div>
        </div>

        <!-- ✅ BOTONES DE ACCIÓN -->
        <div class="contenedor-botones-accion" id="filaBotonesAccion">
            <button class="btn-accion btn-generar" id="btnGenerar" onclick="generarEtiquetas()">🔄 Generar</button>
            <button class="btn-accion btn-grs" id="btnToggleGRs" onclick="abrirModalGRs()">🛠️ Personalizar GRs</button>
            <button class="btn-accion btn-imprimir" id="btnImprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>

        <!-- PANEL DE AJUSTES -->
        <div class="panel-ajustes" id="panelAjustes">
            <div class="tabs-ajustes">
                <button class="tab-btn active" onclick="cambiarTab(event, 'tabTexto')">📝 Texto</button>
                <button class="tab-btn" onclick="cambiarTab(event, 'tabEtiqueta')">📐 Etiqueta</button>
                <button class="tab-btn" onclick="cambiarTab(event, 'tabLogo')">🖼️ Logo</button>
            </div>

            <div class="tab-content active" id="tabTexto">
                <div class="ajuste-compacto">
                    <label>Fuente:</label>
                    <select id="selectFuente" onchange="aplicarAjustes()">
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                </div>
                <div class="ajuste-compacto">
                    <label>Tamaño:</label>
                    <input type="text" id="selectTamaño" list="listaTamaños" value="18" oninput="aplicarAjustes()" style="flex:1;">
                    <datalist id="listaTamaños">
                        <option value="10"><option value="12"><option value="14"><option value="16"><option value="18"><option value="20"><option value="22"><option value="24"><option value="26"><option value="28"><option value="36"><option value="48">
                    </datalist>
                </div>
                <div class="ajuste-compacto">
                    <label>Grosor:</label>
                    <select id="selectGrosor" onchange="aplicarAjustes()">
                        <option value="400">Normal</option>
                        <option value="700" selected>Negrita</option>
                    </select>
                </div>
                <div class="ajuste-compacto">
                    <label>Alineación:</label>
                    <select id="selectAlineacion" onchange="aplicarAjustes()">
                        <option value="left" selected>Izquierda</option>
                        <option value="center">Centrada</option>
                    </select>
                </div>
            </div>

            <div class="tab-content" id="tabEtiqueta">
                <div class="ajuste-compacto">
                    <label>Ancho:</label>
                    <input type="range" id="sliderAncho" min="14" max="19" step="0.5" value="16" oninput="aplicarAjustes()">
                    <span class="valor" id="valorAncho">16cm</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Alto:</label>
                    <input type="range" id="sliderAlto" min="8" max="12" step="0.5" value="9.22" oninput="aplicarAjustes()">
                    <span class="valor" id="valorAlto">9.22cm</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Separación:</label>
                    <input type="range" id="sliderSeparacion" min="5" max="30" value="15" oninput="aplicarAjustes()">
                    <span class="valor" id="valorSeparacion">15mm</span>
                </div>
            </div>

            <div class="tab-content" id="tabLogo">
                <div class="ajuste-compacto">
                    <label>Mostrar:</label>
                    <input type="checkbox" id="checkLogo" checked onchange="aplicarAjustes()">
                </div>
                <div class="ajuste-compacto">
                    <label>Tamaño:</label>
                    <input type="range" id="sliderLogoSize" min="3" max="8" step="0.5" value="5.32" oninput="aplicarAjustes()">
                    <span class="valor" id="valorLogoSize">5.32cm</span>
                </div>
            </div>

            <button class="btn-reset-ajustes" onclick="resetearAjustes()">↺ Restaurar valores por defecto</button>
        </div>
    </div>

    <!-- ✅ VENTANA MODAL (FLOTANTE) PARA GRs CON BOTÓN GENERAR -->
    <div class="modal-fondo" id="modalGRs">
        <div class="modal-caja">
            <div class="modal-header">
                <h3>Personalizar Guías (GRs)</h3>
                <button class="btn-cerrar-modal" onclick="cerrarModalGRs()">×</button>
            </div>
            <div class="modal-body">
                <p style="font-size: 13px; color: #555; margin-bottom: 15px;">
                    Agrega las GRs y la cantidad de etiquetas. Al darle a "Generar Etiquetas", el sistema usará estas cantidades exactas.
                </p>
                <table class="tabla-grs">
                    <thead>
                        <tr>
                            <th style="width: 60%;">N° de GR</th>
                            <th style="width: 25%;">Cant. Etiquetas</th>
                            <th style="width: 15%;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaGRs"></tbody>
                </table>
                <button class="btn-agregar-gr" onclick="agregarFilaGR()">➕ Agregar otra GR</button>
                <div class="total-etiquetas" id="totalEtiquetasTexto">Total: 0 etiquetas</div>
            </div>
            <div class="modal-footer">
                <!-- ✅ NUEVO BOTÓN DE GENERAR ADENTRO DEL MODAL -->
                <button class="btn-modal btn-generar-modal" onclick="generarEtiquetasDesdeModal()">🔄 Generar Etiquetas</button>
                <button class="btn-modal btn-cancelar" onclick="cerrarModalGRs()">Cancelar</button>
                <button class="btn-modal btn-aplicar" onclick="aplicarGRs()">Aplicar y Cerrar</button>
            </div>
        </div>
    </div>

    <div id="contenedor-etiquetas"></div>
    <div class="indicador-etiqueta" id="indicadorEtiqueta">Etiqueta 1 / 1</div>

    <script>
        let etiquetasWord = [];
        let totalEtiquetasActuales = 0;
        let etiquetaActual = 1;
        
        // ✅ VARIABLE PARA GUARDAR LA LISTA DE GRs APLICADA
        let listaGRsAplicada = []; 

        function cambiarTab(event, tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        // ✅ LÓGICA DE LA VENTANA MODAL
        function abrirModalGRs() {
            document.getElementById('modalGRs').style.display = 'flex';
        }

        function cerrarModalGRs() {
            document.getElementById('modalGRs').style.display = 'none';
        }

        function agregarFilaGR() {
            const tbody = document.getElementById('cuerpoTablaGRs');
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td><input type="text" class="input-gr" placeholder="Ej: T711-3517" oninput="actualizarTotalModal()"></td>
                <td><input type="number" class="input-cantidad" value="1" min="1" oninput="actualizarTotalModal()"></td>
                <td style="text-align: center;"><button class="btn-eliminar-gr" onclick="this.closest('tr').remove(); actualizarTotalModal();">🗑️</button></td>
            `;
            tbody.appendChild(fila);
            fila.querySelector('.input-gr').focus();
            actualizarTotalModal();
        }

        function actualizarTotalModal() {
            let total = 0;
            document.querySelectorAll('.input-cantidad').forEach(input => {
                total += parseInt(input.value) || 0;
            });
            document.getElementById('totalEtiquetasTexto').textContent = 'Total: ' + total + ' etiquetas';
        }

        // ✅ LEER Y GUARDAR LAS GRs
        function procesarGRsDelModal() {
            const filas = document.querySelectorAll('#cuerpoTablaGRs tr');
            const nuevaLista = [];
            
            filas.forEach(fila => {
                const gr = fila.querySelector('.input-gr').value.trim();
                const cantidad = parseInt(fila.querySelector('.input-cantidad').value) || 0;
                
                if (gr !== '' && cantidad > 0) {
                    for (let c = 0; c < cantidad; c++) {
                        nuevaLista.push(gr);
                    }
                }
            });
            return nuevaLista;
        }

        // ✅ BOTÓN "APLICAR Y CERRAR" (Solo guarda y actualiza el botón gris)
        function aplicarGRs() {
            listaGRsAplicada = procesarGRsDelModal();
            
            const btn = document.getElementById('btnToggleGRs');
            if (listaGRsAplicada.length > 0) {
                btn.innerHTML = '✅ GRs Cargadas (' + listaGRsAplicada.length + ')';
                btn.style.background = '#007bff';
            } else {
                btn.innerHTML = '🛠️ Personalizar GRs';
                btn.style.background = '#6c757d';
            }
            cerrarModalGRs();
        }

        // ✅ BOTÓN "GENERAR ETIQUETAS" (Adentro del modal)
        function generarEtiquetasDesdeModal() {
            listaGRsAplicada = procesarGRsDelModal();
            if (listaGRsAplicada.length === 0) {
                alert("⚠️ Agrega al menos una GR con cantidad mayor a 0.");
                return;
            }
            cerrarModalGRs(); // Cerramos la ventana
            generarEtiquetas(true); // Llamamos a la función principal, indicando que venga del modal
        }

        function aplicarAjustes() {
            const fuente = document.getElementById('selectFuente').value;
            const tamaño = document.getElementById('selectTamaño').value;
            const grosor = document.getElementById('selectGrosor').value;
            const alineacion = document.getElementById('selectAlineacion').value;
            const ancho = document.getElementById('sliderAncho').value;
            const alto = document.getElementById('sliderAlto').value;
            const separacion = document.getElementById('sliderSeparacion').value;
            const mostrarLogo = document.getElementById('checkLogo').checked;
            const logoSize = document.getElementById('sliderLogoSize').value;

            document.getElementById('valorAncho').textContent = ancho + 'cm';
            document.getElementById('valorAlto').textContent = alto + 'cm';
            document.getElementById('valorSeparacion').textContent = separacion + 'mm';
            document.getElementById('valorLogoSize').textContent = logoSize + 'cm';

            let styleTag = document.getElementById('estilos-dinamicos');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'estilos-dinamicos';
                document.head.appendChild(styleTag);
            }
            styleTag.innerHTML = `
                .etiqueta { width: ${ancho}cm !important; height: ${alto}cm !important; }
                .etiqueta + .etiqueta { margin-top: ${separacion}mm !important; }
                .texto-etiqueta { font-family: ${fuente}, Arial, sans-serif !important; font-size: ${tamaño}px !important; font-weight: ${grosor} !important; text-align: ${alineacion} !important; }
                .logo-dimexa { display: ${mostrarLogo ? 'block' : 'none'} !important; width: ${logoSize}cm !important; }
            `;
        }

        function resetearAjustes() {
            document.getElementById('selectFuente').value = 'Arial';
            document.getElementById('selectTamaño').value = 18;
            document.getElementById('selectGrosor').value = '700';
            document.getElementById('selectAlineacion').value = 'left';
            document.getElementById('sliderAncho').value = 16;
            document.getElementById('sliderAlto').value = 9.22;
            document.getElementById('sliderSeparacion').value = 15;
            document.getElementById('checkLogo').checked = true;
            document.getElementById('sliderLogoSize').value = 5.32;
            aplicarAjustes();
        }

        document.getElementById('inputArchivo').addEventListener('change', function(e) {
            const archivo = e.target.files[0];
            if (!archivo) return;
            const lector = new FileReader();
            lector.onload = function(e) {
                mammoth.convertToHtml({arrayBuffer: e.target.result})
                    .then(function(resultado) {
                        let textoConSaltos = resultado.value
                            .replace(/<\/p>/gi, '\n').replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n')
                            .replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
                        const partes = textoConSaltos.split(/(?=DE:)/gi);
                        etiquetasWord = partes.map(p => p.trim()).filter(p => p.length > 0 && p.toUpperCase().includes("DE:"));
                        alert("✅ Word cargado. Se encontraron " + etiquetasWord.length + " etiquetas.");
                    })
                    .catch(function(error) { alert("Error: " + error); });
            };
            lector.readAsArrayBuffer(archivo);
        });

        function buscarEtiquetas() {
            const busqueda = document.getElementById('inputBusqueda').value.trim().toUpperCase();
            if (etiquetasWord.length === 0) { alert("⚠️ Primero sube un Word."); return; }
            if (busqueda === "") { alert("⚠️ Escribe algo para buscar."); return; }

            const resultados = etiquetasWord.filter(bloque => bloque.toUpperCase().includes(busqueda));
            if (resultados.length === 0) { alert("❌ No se encontró: " + busqueda); return; }

            const editor = document.getElementById('editorTexto');
            editor.innerHTML = resultados[0].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/ /g, '&nbsp;').replace(/\n/g, '<br>');

            document.getElementById('grupoEditor').style.display = 'block';
            document.getElementById('filaCajas').style.display = 'flex';
            document.getElementById('filaBotonesAccion').style.display = 'flex';
            document.getElementById('btnGenerar').style.display = 'flex';
            document.getElementById('panelAjustes').style.display = 'block';
            document.getElementById('btnImprimir').style.display = 'none';
            
            // Limpiar GRs y reiniciar
            listaGRsAplicada = [];
            document.getElementById('cuerpoTablaGRs').innerHTML = '';
            document.getElementById('totalEtiquetasTexto').textContent = 'Total: 0 etiquetas';
            const btnGR = document.getElementById('btnToggleGRs');
            btnGR.innerHTML = '🛠️ Personalizar GRs';
            btnGR.style.background = '#6c757d';

            document.getElementById('contenedor-etiquetas').innerHTML = '';
        }

        // ✅ FUNCIÓN PRINCIPAL DE GENERACIÓN
        function generarEtiquetas(desdeModal = false) {
            const editor = document.getElementById('editorTexto');
            let textoHTML = editor.innerHTML;
            if (textoHTML.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, '').trim() === "") { alert("⚠️ Texto vacío."); return; }

            let totalCajas;

            // Si viene del modal, o si ya hay GRs aplicadas y no se tocó el input a mano, usamos las GRs.
            if (desdeModal || (listaGRsAplicada.length > 0 && document.getElementById('inputTotalCajas').value == listaGRsAplicada.length)) {
                totalCajas = listaGRsAplicada.length;
            } else {
                totalCajas = parseInt(document.getElementById('inputTotalCajas').value);
            }

            if (isNaN(totalCajas) || totalCajas < 1) { alert("⚠️ Número de etiquetas inválido."); return; }

            totalEtiquetasActuales = totalCajas;
            etiquetaActual = 1;
            const contenedor = document.getElementById('contenedor-etiquetas');
            contenedor.innerHTML = '';
            const totalHojas = Math.ceil(totalCajas / 2);

            let textoPlano = textoHTML
                .replace(/<br\s*\/?>/gi, '\n').replace(/<\/div>/gi, '\n').replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
            const lineasOriginales = textoPlano.split('\n');

            for (let i = 0; i < totalHojas; i++) {
                const hoja = document.createElement('div');
                hoja.className = 'hoja';

                for (let j = 0; j < 2; j++) {
                    const numeroCajaActual = (i * 2) + j + 1;
                    if (numeroCajaActual > totalCajas) break;

                    const numeroFormateado = String(numeroCajaActual).padStart(2, '0');
                    const totalFormateado = String(totalCajas).padStart(2, '0');

                    let grDeEstaEtiqueta = null;
                    if (listaGRsAplicada.length > 0 && numeroCajaActual <= listaGRsAplicada.length) {
                        grDeEstaEtiqueta = listaGRsAplicada[numeroCajaActual - 1];
                    }

                    let lineasFinales = lineasOriginales.map(linea => {
                        let nuevaLinea = linea;
                        if (nuevaLinea.toUpperCase().includes('CAJAS')) {
                            nuevaLinea = nuevaLinea.replace(/(\d+)\s*\/\s*(\d+)/, `${numeroFormateado}/ ${totalFormateado}`);
                        }
                        if (grDeEstaEtiqueta && (nuevaLinea.toUpperCase().includes('GUÍAS') || nuevaLinea.toUpperCase().includes('GUIA'))) {
                            nuevaLinea = nuevaLinea.replace(/(GUÍAS?\s*N°:\s*)(.*)/i, `$1${grDeEstaEtiqueta}`);
                        }
                        return nuevaLinea;
                    });

                    let textoFinal = lineasFinales.map(l => l.replace(/ /g, '&nbsp;')).join('<br>');
                    textoFinal = textoFinal
                        .replace(/DE:/g, '<span>DE:</span>').replace(/PARA:/g, '<span>PARA:</span>')
                        .replace(/DIRECCIÓN:/g, '<span>DIRECCIÓN:</span>').replace(/DIRECCION:/g, '<span>DIRECCION:</span>')
                        .replace(/GUÍAS&nbsp;N°:/g, '<span>GUÍAS&nbsp;N°:</span>').replace(/GUIA&nbsp;N°:/g, '<span>GUIA&nbsp;N°:</span>')
                        .replace(/N°&nbsp;CAJAS:/g, '<span>N°&nbsp;CAJAS:</span>').replace(/N°\s*CAJAS:/g, '<span>N° CAJAS:</span>');

                    const etiqueta = document.createElement('div');
                    etiqueta.className = 'etiqueta';
                    etiqueta.id = 'etiqueta-' + numeroCajaActual;
                    etiqueta.innerHTML = `
                        <div class="texto-etiqueta" contenteditable="true">${textoFinal}</div>
                        <img src="logo.png" class="logo-dimexa" alt="Logo Dimexa">
                    `;
                    hoja.appendChild(etiqueta);
                }
                contenedor.appendChild(hoja);
            }

            document.getElementById('btnImprimir').style.display = 'flex';
            document.getElementById('inputIrEtiqueta').max = totalCajas;
            aplicarAjustes();
            actualizarIndicador();
        }

        function irAEtiqueta() {
            const numero = parseInt(document.getElementById('inputIrEtiqueta').value);
            if (isNaN(numero) || numero < 1 || numero > totalEtiquetasActuales) { alert("⚠️ Número inválido."); return; }
            etiquetaActual = numero;
            const etiqueta = document.getElementById('etiqueta-' + numero);
            if (etiqueta) {
                etiqueta.scrollIntoView({ behavior: 'smooth', block: 'center' });
                etiqueta.classList.add('etiqueta-resaltada');
                setTimeout(() => etiqueta.classList.remove('etiqueta-resaltada'), 1500);
                actualizarIndicador();
            }
        }

        function actualizarIndicador() {
            const indicador = document.getElementById('indicadorEtiqueta');
            if (totalEtiquetasActuales > 0) {
                indicador.textContent = 'Etiqueta ' + etiquetaActual + ' / ' + totalEtiquetasActuales;
                indicador.classList.add('visible');
            } else {
                indicador.classList.remove('visible');
            }
        }
    </script>

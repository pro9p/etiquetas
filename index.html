<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas Dimexa</title>
    <script src="mammoth.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @page { size: A4; margin: 0; }

        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        
        /* --- FORMULARIO --- */
        .panel-control {
            background: white; padding: 20px; margin: 20px auto; max-width: 1100px;
            border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;
        }
        .panel-control h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        
        input[type="file"], input[type="text"], input[type="number"] { 
            margin: 5px 0; padding: 12px; border: 1px solid #ccc; 
            border-radius: 4px; width: 100%; box-sizing: border-box; font-size: 16px;
        }
        
        .editor {
            width: 100%; min-height: 120px; padding: 10px; 
            border: 2px dashed #007bff; border-radius: 4px; 
            font-family: Arial, sans-serif; font-size: 15px; 
            resize: vertical; outline: none; background-color: #f0f8ff;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            tab-size: 4;
        }
        .editor:focus { border-color: #ff9800; background-color: #fff8f0; }

        .btn {
            color: white; border: none; padding: 12px 25px;
            font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%;
        }
        .btn-buscar { background-color: #007bff; }
        .btn-buscar:hover { background-color: #0056b3; }
        
        .botones-accion {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-accion {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            color: white; border: none;
            border-radius: 5px; cursor: pointer;
            display: none;
        }
        .btn-generar { background-color: #ff9800; }
        .btn-generar:hover { background-color: #e68900; }
        .btn-imprimir { background-color: #28a745; }
        .btn-imprimir:hover { background-color: #218838; }

        .fila-cajas {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-top: 15px;
        }
        .fila-cajas .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .fila-cajas .form-group:first-child {
            flex: 0 0 180px;
        }
        
        .navegador-controles {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .navegador-controles input {
            width: 100px;
            text-align: center;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-ir {
            background-color: #ffc107;
            color: black;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-ir:hover { background-color: #e0a800; }

        /* ✅ PANEL DE AJUSTES TIPO "WORD" (COMPACTO) */
        .panel-ajustes {
            display: none;
            background-color: #f8f9fa;
            border: 1px solid #007bff;
            border-radius: 6px;
            padding: 10px;
            margin-top: 15px;
            text-align: left;
        }

        .tabs-ajustes {
            display: flex;
            gap: 3px;
            border-bottom: 2px solid #007bff;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #e9ecef;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: #dee2e6; }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }

        .tab-content {
            display: none;
            padding: 8px 0;
        }
        .tab-content.active {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 8px 15px;
        }

        .ajuste-compacto {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        .ajuste-compacto label {
            flex: 0 0 90px;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            text-align: right;
        }
        .ajuste-compacto input[type="range"] {
            flex: 1;
            cursor: pointer;
            height: 4px;
        }
        .ajuste-compacto select {
            flex: 1;
            padding: 3px 5px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }
        .ajuste-compacto input[type="color"] {
            flex: 1;
            height: 24px;
            padding: 1px;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }
        .ajuste-compacto .valor {
            flex: 0 0 45px;
            text-align: right;
            font-size: 11px;
            font-weight: bold;
            color: #007bff;
        }
        .ajuste-compacto input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-reset-ajustes {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
        }
        .btn-reset-ajustes:hover { background-color: #5a6268; }

        /* INDICADOR DE ETIQUETA ACTUAL */
        .indicador-etiqueta {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background-color: #333;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            z-index: 9999;
        }
        .indicador-etiqueta.visible {
            display: block;
        }

        /* --- ETIQUETAS --- */
        .hoja {
            width: 210mm; 
            height: 297mm; 
            background: white; 
            margin: 5mm auto;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            padding-top: 15mm;
            padding-bottom: 0;
            page-break-after: always;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .hoja:last-child { 
            page-break-after: auto; 
        }

        .etiqueta {
            width: 16cm;
            height: 9.22cm;
            border: 3px solid black; 
            margin-bottom: 0;
            padding: 0.25cm; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            overflow: hidden;
        }

        .etiqueta + .etiqueta {
            margin-top: 15mm;
        }
        
        .texto-etiqueta {
            flex: 1; 
            font-size: 18px;
            font-weight: bold; 
            color: black;
            font-family: Arial, sans-serif;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.4; 
            padding-right: 10px; 
            outline: none;
            border: 1px dashed #ccc;
            padding: 5px;
            min-height: 50px;
        }
        .texto-etiqueta:focus {
            border-color: #007bff;
            background-color: #f0f8ff;
        }
        .texto-etiqueta span { text-decoration: underline; }

        .logo-dimexa {
            position: absolute; bottom: 0.25cm; right: 0.25cm; 
            width: 5.32cm; height: 2.14cm; object-fit: contain; 
            pointer-events: none;
        }

        .etiqueta-resaltada {
            animation: parpadeo 1s ease-in-out 3;
            box-shadow: 0 0 0 5px #ffc107;
        }
        @keyframes parpadeo {
            0% { box-shadow: 0 0 0 5px #ffc107; }
            50% { box-shadow: 0 0 0 5px #ff5722; }
            100% { box-shadow: 0 0 0 5px #ffc107; }
        }

        @media print {
            body { background-color: white; }
            .hoja { 
                margin: 0; 
                padding-top: 15mm;
                padding-bottom: 0;
                box-shadow: none;
            }
            .panel-control { display: none; }
            .indicador-etiqueta { display: none !important; }
            .panel-ajustes { display: none !important; }
            .texto-etiqueta { border: none; }
        }
    </style>
</head>
<body>

    <div class="panel-control no-imprimir">
        <h2>🔍 Buscador de Etiquetas desde Word</h2>
        
        <div class="form-group">
            <label>1. Sube tu archivo Word (.docx):</label>
            <input type="file" id="inputArchivo" accept=".docx">
        </div>

        <div class="form-group">
            <label>2. Busca el cliente:</label>
            <input type="text" id="inputBusqueda" placeholder="Escribe el nombre del cliente...">
        </div>
        
        <button class="btn btn-buscar" onclick="buscarEtiquetas()">🔍 Buscar</button>

        <div class="form-group" id="grupoEditor" style="display: none; margin-top: 20px;">
            <label>3. Edita el texto MAESTRO (se replicará a todas las etiquetas):</label>
            <div id="editorTexto" class="editor" contenteditable="true"></div>
        </div>

        <div class="fila-cajas" id="filaCajas" style="display: none;">
            <div class="form-group">
                <label>N° de etiquetas</label>
                <input type="number" id="inputTotalCajas" value="1" min="1">
            </div>
            <div class="form-group">
                <label>🔎 Ir a la etiqueta N°</label>
                <div class="navegador-controles">
                    <input type="number" id="inputIrEtiqueta" placeholder="Ej: 25" min="1">
                    <button class="btn-ir" onclick="irAEtiqueta()">Ir</button>
                </div>
            </div>
        </div>

        <div class="botones-accion">
            <button class="btn-accion btn-generar" id="btnGenerar" onclick="generarEtiquetas()">🔄 Generar</button>
            <button class="btn-accion btn-imprimir" id="btnImprimir" onclick="window.print()">🖨️ Imprimir</button>
        </div>

        <!-- ✅ PANEL DE AJUSTES COMPACTO -->
        <div class="panel-ajustes" id="panelAjustes">
            <div class="tabs-ajustes">
                <button class="tab-btn active" onclick="cambiarTab(event, 'tabTexto')">📝 Texto</button>
                <button class="tab-btn" onclick="cambiarTab(event, 'tabEtiqueta')">📐 Etiqueta</button>
                <button class="tab-btn" onclick="cambiarTab(event, 'tabLogo')">🖼️ Logo</button>
                <button class="tab-btn" onclick="cambiarTab(event, 'tabHoja')">📄 Hoja</button>
            </div>

            <div class="tab-content active" id="tabTexto">
                <div class="ajuste-compacto">
                    <label>Fuente:</label>
                    <select id="selectFuente" onchange="aplicarAjustes()">
                        <option value="Arial">Arial</option>
                        <option value="Helvetica">Helvetica</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Calibri">Calibri</option>
                        <option value="Tahoma">Tahoma</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier New</option>
                    </select>
                </div>
                <div class="ajuste-compacto">
                    <label>Tamaño:</label>
                    <input type="range" id="sliderFuente" min="14" max="40" value="18" oninput="aplicarAjustes()">
                    <span class="valor" id="valorFuente">18px</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Grosor:</label>
                    <select id="selectGrosor" onchange="aplicarAjustes()">
                        <option value="300">Ligera</option>
                        <option value="400">Normal</option>
                        <option value="700" selected>Negrita</option>
                        <option value="900">Súper negrita</option>
                    </select>
                </div>
                <div class="ajuste-compacto">
                    <label>Color:</label>
                    <input type="color" id="colorFuente" value="#000000" onchange="aplicarAjustes()">
                </div>
                <div class="ajuste-compacto">
                    <label>Alineación:</label>
                    <select id="selectAlineacion" onchange="aplicarAjustes()">
                        <option value="left" selected>Izquierda</option>
                        <option value="center">Centrada</option>
                        <option value="right">Derecha</option>
                        <option value="justify">Justificada</option>
                    </select>
                </div>
                <div class="ajuste-compacto">
                    <label>Interlineado:</label>
                    <input type="range" id="sliderLineHeight" min="1.0" max="2.0" step="0.1" value="1.4" oninput="aplicarAjustes()">
                    <span class="valor" id="valorLineHeight">1.4</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Esp. letras:</label>
                    <input type="range" id="sliderLetterSpacing" min="-1" max="3" step="0.5" value="0" oninput="aplicarAjustes()">
                    <span class="valor" id="valorLetterSpacing">0px</span>
                </div>
            </div>

            <div class="tab-content" id="tabEtiqueta">
                <div class="ajuste-compacto">
                    <label>Ancho:</label>
                    <input type="range" id="sliderAncho" min="14" max="19" step="0.5" value="16" oninput="aplicarAjustes()">
                    <span class="valor" id="valorAncho">16cm</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Alto:</label>
                    <input type="range" id="sliderAlto" min="8" max="12" step="0.5" value="9.22" oninput="aplicarAjustes()">
                    <span class="valor" id="valorAlto">9.22cm</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Separación:</label>
                    <input type="range" id="sliderSeparacion" min="5" max="30" value="15" oninput="aplicarAjustes()">
                    <span class="valor" id="valorSeparacion">15mm</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Borde:</label>
                    <input type="range" id="sliderBorde" min="1" max="8" value="3" oninput="aplicarAjustes()">
                    <span class="valor" id="valorBorde">3px</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Color borde:</label>
                    <input type="color" id="colorBorde" value="#000000" onchange="aplicarAjustes()">
                </div>
                <div class="ajuste-compacto">
                    <label>Padding:</label>
                    <input type="range" id="sliderPadding" min="0" max="1" step="0.05" value="0.25" oninput="aplicarAjustes()">
                    <span class="valor" id="valorPadding">0.25cm</span>
                </div>
            </div>

            <div class="tab-content" id="tabLogo">
                <div class="ajuste-compacto">
                    <label>Mostrar:</label>
                    <input type="checkbox" id="checkLogo" checked onchange="aplicarAjustes()">
                </div>
                <div class="ajuste-compacto">
                    <label>Tamaño:</label>
                    <input type="range" id="sliderLogoSize" min="3" max="8" step="0.5" value="5.32" oninput="aplicarAjustes()">
                    <span class="valor" id="valorLogoSize">5.32cm</span>
                </div>
                <div class="ajuste-compacto">
                    <label>Posición:</label>
                    <select id="selectPosLogo" onchange="aplicarAjustes()">
                        <option value="bottom-right" selected>Abajo - Der.</option>
                        <option value="bottom-left">Abajo - Izq.</option>
                        <option value="top-right">Arriba - Der.</option>
                        <option value="top-left">Arriba - Izq.</option>
                    </select>
                </div>
            </div>

            <div class="tab-content" id="tabHoja">
                <div class="ajuste-compacto">
                    <label>Margen sup:</label>
                    <input type="range" id="sliderMargenSup" min="5" max="30" value="15" oninput="aplicarAjustes()">
                    <span class="valor" id="valorMargenSup">15mm</span>
                </div>
            </div>

            <button class="btn-reset-ajustes" onclick="resetearAjustes()">↺ Restaurar valores por defecto</button>
        </div>
    </div>

    <div id="contenedor-etiquetas"></div>

    <div class="indicador-etiqueta" id="indicadorEtiqueta">Etiqueta 1 / 1</div>

    <script>
        let etiquetasWord = [];
        let totalEtiquetasActuales = 0;
        let etiquetaActual = 1;

        function cambiarTab(event, tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        window.addEventListener('load', function() {
            document.getElementById('inputArchivo').value = '';
            document.getElementById('inputBusqueda').value = '';
            document.getElementById('editorTexto').innerHTML = '';
            document.getElementById('grupoEditor').style.display = 'none';
            document.getElementById('filaCajas').style.display = 'none';
            document.getElementById('btnGenerar').style.display = 'none';
            document.getElementById('btnImprimir').style.display = 'none';
            document.getElementById('panelAjustes').style.display = 'none';
            document.getElementById('contenedor-etiquetas').innerHTML = '';
            document.getElementById('indicadorEtiqueta').classList.remove('visible');
            
            etiquetasWord = [];
            totalEtiquetasActuales = 0;
            etiquetaActual = 1;
        });

        function aplicarAjustes() {
            const fuente = document.getElementById('selectFuente').value;
            const tamaño = document.getElementById('sliderFuente').value;
            const grosor = document.getElementById('selectGrosor').value;
            const colorFuente = document.getElementById('colorFuente').value;
            const alineacion = document.getElementById('selectAlineacion').value;
            const lineHeight = document.getElementById('sliderLineHeight').value;
            const letterSpacing = document.getElementById('sliderLetterSpacing').value;

            const ancho = document.getElementById('sliderAncho').value;
            const alto = document.getElementById('sliderAlto').value;
            const separacion = document.getElementById('sliderSeparacion').value;
            const borde = document.getElementById('sliderBorde').value;
            const colorBorde = document.getElementById('colorBorde').value;
            const padding = document.getElementById('sliderPadding').value;

            const mostrarLogo = document.getElementById('checkLogo').checked;
            const logoSize = document.getElementById('sliderLogoSize').value;
            const posLogo = document.getElementById('selectPosLogo').value;

            const margenSup = document.getElementById('sliderMargenSup').value;

            document.getElementById('valorFuente').textContent = tamaño + 'px';
            document.getElementById('valorLineHeight').textContent = lineHeight;
            document.getElementById('valorLetterSpacing').textContent = letterSpacing + 'px';
            document.getElementById('valorAncho').textContent = ancho + 'cm';
            document.getElementById('valorAlto').textContent = alto + 'cm';
            document.getElementById('valorSeparacion').textContent = separacion + 'mm';
            document.getElementById('valorBorde').textContent = borde + 'px';
            document.getElementById('valorPadding').textContent = padding + 'cm';
            document.getElementById('valorLogoSize').textContent = logoSize + 'cm';
            document.getElementById('valorMargenSup').textContent = margenSup + 'mm';

            const logoStyles = {
                'bottom-right': 'bottom: 0.25cm; right: 0.25cm;',
                'bottom-left': 'bottom: 0.25cm; left: 0.25cm;',
                'top-right': 'top: 0.25cm; right: 0.25cm;',
                'top-left': 'top: 0.25cm; left: 0.25cm;'
            };

            let styleTag = document.getElementById('estilos-dinamicos');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'estilos-dinamicos';
                document.head.appendChild(styleTag);
            }
            styleTag.innerHTML = `
                .hoja { padding-top: ${margenSup}mm !important; }
                .etiqueta { 
                    width: ${ancho}cm !important; 
                    height: ${alto}cm !important; 
                    border: ${borde}px solid ${colorBorde} !important;
                    padding: ${padding}cm !important;
                }
                .etiqueta + .etiqueta { margin-top: ${separacion}mm !important; }
                .texto-etiqueta { 
                    font-family: ${fuente}, Arial, sans-serif !important;
                    font-size: ${tamaño}px !important; 
                    font-weight: ${grosor} !important;
                    color: ${colorFuente} !important;
                    text-align: ${alineacion} !important;
                    line-height: ${lineHeight} !important;
                    letter-spacing: ${letterSpacing}px !important;
                }
                .logo-dimexa { 
                    display: ${mostrarLogo ? 'block' : 'none'} !important;
                    width: ${logoSize}cm !important;
                    height: auto !important;
                    ${logoStyles[posLogo]}
                }
            `;
        }

        function resetearAjustes() {
            document.getElementById('selectFuente').value = 'Arial';
            document.getElementById('sliderFuente').value = 18;
            document.getElementById('selectGrosor').value = '700';
            document.getElementById('colorFuente').value = '#000000';
            document.getElementById('selectAlineacion').value = 'left';
            document.getElementById('sliderLineHeight').value = 1.4;
            document.getElementById('sliderLetterSpacing').value = 0;

            document.getElementById('sliderAncho').value = 16;
            document.getElementById('sliderAlto').value = 9.22;
            document.getElementById('sliderSeparacion').value = 15;
            document.getElementById('sliderBorde').value = 3;
            document.getElementById('colorBorde').value = '#000000';
            document.getElementById('sliderPadding').value = 0.25;

            document.getElementById('checkLogo').checked = true;
            document.getElementById('sliderLogoSize').value = 5.32;
            document.getElementById('selectPosLogo').value = 'bottom-right';

            document.getElementById('sliderMargenSup').value = 15;

            aplicarAjustes();
        }

        function limpiarBusquedaYEtiquetas() {
            document.getElementById('inputBusqueda').value = '';
            document.getElementById('editorTexto').innerHTML = '';
            document.getElementById('grupoEditor').style.display = 'none';
            document.getElementById('filaCajas').style.display = 'none';
            document.getElementById('btnGenerar').style.display = 'none';
            document.getElementById('btnImprimir').style.display = 'none';
            document.getElementById('panelAjustes').style.display = 'none';
            document.getElementById('contenedor-etiquetas').innerHTML = '';
            document.getElementById('indicadorEtiqueta').classList.remove('visible');
            
            totalEtiquetasActuales = 0;
            etiquetaActual = 1;

            document.getElementById('inputBusqueda').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('inputArchivo').addEventListener('change', function(e) {
            const archivo = e.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                mammoth.convertToHtml({arrayBuffer: e.target.result})
                    .then(function(resultado) {
                        extraerEtiquetasDelWord(resultado.value);
                    })
                    .catch(function(error) {
                        alert("Error al leer el archivo Word: " + error);
                    });
            };
            lector.readAsArrayBuffer(archivo);
        });

        function extraerEtiquetasDelWord(html) {
            let textoConSaltos = html
                .replace(/<\/p>/gi, '\n')
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/div>/gi, '\n')
                .replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/\n\s*\n/g, '\n\n');

            const partes = textoConSaltos.split(/(?=DE:)/gi);

            etiquetasWord = partes
                .map(p => p.trim())
                .filter(p => p.length > 0 && p.toUpperCase().includes("DE:"));

            if (etiquetasWord.length === 0) {
                alert("⚠️ No se encontraron etiquetas. Asegúrate de que cada etiqueta empiece con 'DE:'.");
                return;
            }

            alert("✅ Word cargado. Se encontraron " + etiquetasWord.length + " etiquetas.");
        }

        function buscarEtiquetas() {
            const busqueda = document.getElementById('inputBusqueda').value.trim().toUpperCase();

            if (etiquetasWord.length === 0) {
                alert("⚠️ Primero sube un archivo Word.");
                return;
            }

            if (busqueda === "") {
                alert("⚠️ Escribe algo para buscar.");
                return;
            }

            const resultados = etiquetasWord.filter(bloque => 
                bloque.toUpperCase().includes(busqueda)
            );

            if (resultados.length === 0) {
                alert("❌ No se encontró ninguna etiqueta con: " + busqueda);
                return;
            }

            const editor = document.getElementById('editorTexto');
            editor.innerHTML = resultados[0]
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/ /g, '&nbsp;')
                .replace(/\n/g, '<br>');

            document.getElementById('grupoEditor').style.display = 'block';
            document.getElementById('filaCajas').style.display = 'flex';
            document.getElementById('btnGenerar').style.display = 'block';
            document.getElementById('btnImprimir').style.display = 'none';
            document.getElementById('panelAjustes').style.display = 'block';

            document.getElementById('contenedor-etiquetas').innerHTML = '';
        }

        function generarEtiquetas() {
            const editor = document.getElementById('editorTexto');
            let textoHTML = editor.innerHTML;

            if (textoHTML.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, '').trim() === "") {
                alert("⚠️ El texto está vacío.");
                return;
            }

            const totalCajas = parseInt(document.getElementById('inputTotalCajas').value);

            if (isNaN(totalCajas) || totalCajas < 1) {
                alert("⚠️ Ingresa un número válido de etiquetas (mínimo 1).");
                return;
            }

            totalEtiquetasActuales = totalCajas;
            etiquetaActual = 1;

            const contenedor = document.getElementById('contenedor-etiquetas');
            contenedor.innerHTML = '';

            const totalHojas = Math.ceil(totalCajas / 2);

            let textoPlano = textoHTML
                .replace(/<br\s*\/?>/gi, '\n')
                .replace(/<\/div>/gi, '\n')
                .replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/g, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>');

            const lineasOriginales = textoPlano.split('\n');

            for (let i = 0; i < totalHojas; i++) {
                const hoja = document.createElement('div');
                hoja.className = 'hoja';

                for (let j = 0; j < 2; j++) {
                    const numeroCajaActual = (i * 2) + j + 1;
                    if (numeroCajaActual > totalCajas) break;

                    const numeroFormateado = String(numeroCajaActual).padStart(2, '0');
                    const totalFormateado = String(totalCajas).padStart(2, '0');

                    let lineasFinales = lineasOriginales.map(linea => {
                        if (linea.toUpperCase().includes('CAJAS')) {
                            return linea.replace(
                                /(\d+)\s*\/\s*(\d+)/,
                                `${numeroFormateado}/ ${totalFormateado}`
                            );
                        }
                        return linea;
                    });

                    let textoFinal = lineasFinales
                        .map(l => l.replace(/ /g, '&nbsp;'))
                        .join('<br>');

                    textoFinal = textoFinal
                        .replace(/DE:/g, '<span>DE:</span>')
                        .replace(/PARA:/g, '<span>PARA:</span>')
                        .replace(/DIRECCIÓN:/g, '<span>DIRECCIÓN:</span>')
                        .replace(/DIRECCION:/g, '<span>DIRECCION:</span>')
                        .replace(/GUÍAS&nbsp;N°:/g, '<span>GUÍAS&nbsp;N°:</span>')
                        .replace(/GUIA&nbsp;N°:/g, '<span>GUIA&nbsp;N°:</span>')
                        .replace(/N°&nbsp;CAJAS:/g, '<span>N°&nbsp;CAJAS:</span>')
                        .replace(/N°\s*CAJAS:/g, '<span>N° CAJAS:</span>')
                        .replace(/CAJAS:/g, '<span>CAJAS:</span>');

                    const etiqueta = document.createElement('div');
                    etiqueta.className = 'etiqueta';
                    etiqueta.id = 'etiqueta-' + numeroCajaActual;

                    etiqueta.innerHTML = `
                        <div class="texto-etiqueta" contenteditable="true">${textoFinal}</div>
                        <img src="logo.png" class="logo-dimexa" alt="Logo Dimexa">
                    `;
                    hoja.appendChild(etiqueta);
                }
                contenedor.appendChild(hoja);
            }

            document.getElementById('btnImprimir').style.display = 'block';
            document.getElementById('inputIrEtiqueta').max = totalCajas;
            document.getElementById('inputIrEtiqueta').value = '';

            aplicarAjustes();

            actualizarIndicador();
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (etiquetasWord.length > 0) {
                    limpiarBusquedaYEtiquetas();
                }
                return;
            }

            if (totalEtiquetasActuales === 0) return;

            const elementoActivo = document.activeElement;
            if (elementoActivo.tagName === 'INPUT' || 
                elementoActivo.tagName === 'TEXTAREA' || 
                elementoActivo.isContentEditable) {
                return;
            }

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                irA(etiquetaActual + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                irA(etiquetaActual - 1);
            } else if (e.key === 'Home') {
                e.preventDefault();
                irA(1);
            } else if (e.key === 'End') {
                e.preventDefault();
                irA(totalEtiquetasActuales);
            }
        });

        function irA(numero) {
            if (numero < 1) numero = 1;
            if (numero > totalEtiquetasActuales) numero = totalEtiquetasActuales;

            etiquetaActual = numero;

            const etiqueta = document.getElementById('etiqueta-' + numero);

            if (etiqueta) {
                etiqueta.scrollIntoView({ behavior: 'smooth', block: 'center' });

                etiqueta.classList.add('etiqueta-resaltada');
                setTimeout(() => {
                    etiqueta.classList.remove('etiqueta-resaltada');
                }, 1500);

                actualizarIndicador();
            }
        }

        function actualizarIndicador() {
            const indicador = document.getElementById('indicadorEtiqueta');
            if (totalEtiquetasActuales > 0) {
                indicador.textContent = 'Etiqueta ' + etiquetaActual + ' / ' + totalEtiquetasActuales;
                indicador.classList.add('visible');
            } else {
                indicador.classList.remove('visible');
            }
        }

        function irAEtiqueta() {
            const numero = parseInt(document.getElementById('inputIrEtiqueta').value);

            if (isNaN(numero) || numero < 1 || numero > totalEtiquetasActuales) {
                alert("⚠️ Ingresa un número entre 1 y " + totalEtiquetasActuales);
                return;
            }

            irA(numero);
        }
    </script>

</body>
</html>
